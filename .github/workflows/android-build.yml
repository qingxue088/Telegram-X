name: Android Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "app.id=org.thunderdog.challegram" >> local.properties
        echo "app.name=Telegram X" >> local.properties
        echo "app.download_url=https://telegram.org/dlx" >> local.properties
        echo "tgx.extension=none" >> local.properties
        echo "telegram.api_id=6" >> local.properties
        echo "telegram.api_hash=eb06d4abfb49dc3eeb1aeb98ae0f581e" >> local.properties
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
